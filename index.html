<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Buying Guide - Health and Digital Product Reviews</title>
    <meta name="description" content="Honest reviews and smart buying guides for health products and digital tools.">
    <style>
        :root {
            --green-dark: #14532d;
            --green: #1f8a4c;
            --green-light: #e8f5ec;
            --indigo: #3b4cca;
            --indigo-light: #eceefc;
            --text: #1f2a24;
            --muted: #5b6b62;
            --border: #d5e5db;
            --bg: #f6faf7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: "Segoe UI", Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .nav {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .logo {
            font-weight: 700;
            font-size: 18px;
            color: var(--green-dark);
            text-decoration: none;
        }

        .nav-links { display: flex; gap: 16px; }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-links a:hover { color: var(--green); }

        .hero {
            background: linear-gradient(135deg, #14532d 0%, #1f8a4c 100%);
            color: #ffffff;
            text-align: center;
            padding: 54px 20px 60px;
        }

        .hero h1 { font-size: 30px; margin-bottom: 12px; line-height: 1.25; }

        .hero p {
            max-width: 560px;
            margin: 0 auto 24px;
            color: #d6efde;
            font-size: 16px;
        }

        .hero-buttons { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

        .hero-btn {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
        }

        .hero-btn.light { background: #ffffff; color: var(--green-dark); }
        .hero-btn.outline { border: 2px solid #ffffff; color: #ffffff; }

            margin: -28px auto 0;

            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            position: relative;
